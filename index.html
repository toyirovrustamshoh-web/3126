<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Button Component</title>
        <style>
            html {
                margin: 40px;
                font-family: sans-serif;
            }

            .c-button {
                padding: 12px 20px;
                background-color: #e9e9e9;
                color: #111;
                border: 0;
                border-radius: 24px;
                font-family: inherit;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
            }

            .c-button:hover {
                background-color: #dcdcdc;
            }

            .c-button.c-button--primary {
                background-color: #e60023;
                color: white;
            }

            .c-button.c-button--primary:hover {
                background-color: #ad081b;
            }

            .c-button:disabled {
                background-color: #efefef;
                color: #a0a0a0;
                cursor: not-allowed;
            }

            .c-button.c-button--dark {
                background-color: #111;
                color: white;
            }

            .c-button.c-button--dark:hover {
                background-color: #333;
            }

            .c-button.c-button--more {
                width: 44px;
                height: 44px;
                padding: 0;
                border-radius: 14px;
                background-color: #f4f4ef;
                font-size: 20px;
            }

            .c-button.c-button--more:hover {
                background-color: #e9e9e4;
            }

            .u-margin-large {
                margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <h2>Primary</h2>
        <button class="c-button c-button--primary u-margin-large">
            Create
        </button>

        <h2>Secondary</h2>
        <button class="c-button u-margin-large">Share profile</button>

        <h2>Disabled</h2>
        <button class="c-button u-margin-large" disabled>Create</button>

        <h2>Dark</h2>
        <button class="c-button c-button--dark u-margin-large">Save</button>

        <h2>More (...)</h2>
        <button
            class="c-button c-button--more u-margin-large"
            aria-label="More actions"
        >
            ...
        </button>
    </body>
</html>
