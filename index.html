<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Button Component</title>
        <style>
            html {
                margin: 40px;
                font-family: sans-serif;
            }

            .c-button {
                padding: 12px 20px;
                background-color: #e9e9e9;
                color: #111;
                border: 0;
                border-radius: 24px;
                font-family: inherit;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
            }

            .c-button:hover {
                background-color: #dcdcdc;
            }

            .c-button:focus-visible {
                outline: 3px solid #0074e8;
                outline-offset: 2px;
            }

            .c-button.c-button--primary {
                background-color: #e60023;
                color: white;
            }

            .c-button.c-button--primary:hover {
                background-color: #ad081b;
            }

            .c-button.c-button--secondary {
                background-color: #e9e9e9;
                color: #111;
            }

            .c-button.c-button--secondary:hover {
                background-color: #dcdcdc;
            }

            .c-button.c-button--disabled,
            .c-button:disabled {
                background-color: #efefef;
                color: #a0a0a0;
                cursor: not-allowed;
            }

            .c-button.c-button--dark {
                background-color: #111;
                color: white;
            }

            .c-button.c-button--dark:hover {
                background-color: #333;
            }

            .c-button.c-button--more {
                position: relative;
                width: 44px;
                height: 44px;
                padding: 0;
                border-radius: 14px;
                background-color: #f4f4ef;
                color: #111;
                font-size: 20px;
                line-height: 1;
            }

            .c-button.c-button--more:hover {
                background-color: #e9e9e4;
            }

            .c-button.c-button--more::after {
                content: attr(data-tooltip);
                position: absolute;
                top: calc(100% + 8px);
                left: 0;
                padding: 12px 16px;
                background-color: #111;
                color: white;
                border-radius: 14px;
                font-size: 16px;
                font-weight: 400;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
            }

            .c-button.c-button--more:hover::after,
            .c-button.c-button--more:focus-visible::after {
                opacity: 1;
            }

            .u-margin-large {
                margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <h2>Primary</h2>
        <button class="c-button c-button--primary u-margin-large">
            Create
        </button>

        <h2>Secondary</h2>
        <button class="c-button c-button--secondary u-margin-large">
            Share profile
        </button>

        <h2>Disabled</h2>
        <button class="c-button c-button--disabled u-margin-large" disabled>
            Create
        </button>

        <h2>Dark</h2>
        <button class="c-button c-button--dark u-margin-large" id="save-button">
            Save
        </button>

        <h2>More (...)</h2>
        <button
            class="c-button c-button--more u-margin-large"
            aria-label="More actions"
            data-tooltip="More actions"
        >
            ...
        </button>

        <script>
            const saveButton = document.getElementById("save-button");

            saveButton.addEventListener("click", () => {
                if (saveButton.textContent.trim() === "Save") {
                    saveButton.textContent = "Saved";
                } else {
                    saveButton.textContent = "Save";
                }
            });
        </script>
    </body>
</html>
